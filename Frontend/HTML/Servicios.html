<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios - ServiGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/Inicio.css"> <link rel="stylesheet" href="../CSS/Servicios.css"> </head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="Inicio.html">ServiGo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <form class="d-flex me-auto" role="search">
                    <input class="form-control me-2" type="search" placeholder="Buscar profesional...">
                    <button class="btn btn-outline-primary" type="submit"><i class="bi bi-search"></i></button>
                </form>
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="Inicio.html"><i class="bi bi-house-door-fill"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="Servicios.html"><i class="bi bi-suitcase-lg-fill"></i> Servicios</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"><i class="bi bi-person-circle"></i> Yo</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="index.html">Cerrar Sesión</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <aside class="col-lg-3 mb-4">
                <div class="card shadow-sm p-3">
                    <h5 class="mb-3 fw-bold">Filtros</h5>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Categoría</label>
                        <select class="form-select">
                            <option>Todas las categorías</option>
                            <option>Plomería</option>
                            <option>Electricidad</option>
                            <option>Pintura</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Ubicación</label>
                        <select class="form-select">
                            <option>Toda Lima</option>
                            <option>Miraflores</option>
                            <option>San Isidro</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Calificación</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label small">4.5+ estrellas</label>
                        </div>
                    </div>

                    <button class="btn btn-primary w-100 mt-2">Aplicar Filtros</button>
                </div>
            </aside>

            <main class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold m-0">Resultados encontrados</h4>
                    <span class="text-muted small">Mostrando 1 profesional</span>
                </div>

                <div class="row g-3">
                    <div class="col-md-6 col-xl-4">
                        <div class="card h-100 card-service shadow-sm border-0">
                            <div class="card-body">
                                <h6 class="card-title fw-bold mb-1">Roberto Gómez</h6>
                                <p class="text-primary small mb-2 fw-bold">Plomero Experto</p>
                                <p class="card-text text-muted small text-truncate-2">Especialista en fugas, instalaciones sanitarias y mantenimiento general.</p>
                            </div>
                            <div class="card-footer bg-white border-0 pb-3">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="fw-bold text-dark">S/ 50 <small class="text-muted fw-light">/ hr</small></span>
                                    <a href="#" class="btn btn-sm btn-outline-primary px-3">Ver perfil</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    </div>
            </main>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
