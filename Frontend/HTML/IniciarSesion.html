<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiGo</title>
    <link rel="stylesheet" href="../CSS/IniciarSesion.css">
</head>
<body>
    <main class="contenedor">

        <section class="panel-derecho">
            <img src="../../Images/Index.png" alt="Imagen de servicio">
        </section>

        <section class="panel-izquierdo">
            <div class="tarjeta-formulario">
               
                <h2>Bienvenido</h2>
                <p class="subtitulo">Inicia sesión para continuar</p>
                <form>
                    <div class="grupo-formulario">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico">
                    </div>
                    <div class="grupo-formulario">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña">
                    </div>

                    <a class="olvidado" href="CambiarContraseña.html">¿Olvidaste tu contraseña?</a>

                    <button type="button" onclick="window.location.href='Inicio.html'">Iniciar Sesión</button>

                    <div class="separador"><span>O continúa con</span></div>

                    <div class="redes">
                        <button type="button" onclick="location.href='https://accounts.google.com/v3/signin/identifier?continue=https%3A%2F%2Fmail.google.com%2Fmail%2F&dsh=S-1858874068%3A1776050415149048&rip=1&sacu=1&service=mail&flowName=GlifWebSignIn&flowEntry=ServiceLogin&ifkv=AT1y2_Ua5Z7P2gcLfhSn_P_vwLBb2PFo8MNQmDsIx8VJs3MMGCAPePByfRYHefDyMSLlPmnYZ_78HA'" class="social google"  >Gmail</button>
                        <button type="button" onclick="location.href='https://www.facebook.com/'" class="social facebook">Facebook</button>
                    </div>
                    <p class="registro">¿No tienes una cuenta? <a href="Registro.html">Regístrate</a></p>
                </form>
            </div>
        </section>
       
    </main>
</body>
</html>
