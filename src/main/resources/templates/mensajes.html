<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Mensajes - ServiGo', '/CSS/Mensajes.css')}"></head>

<body>
    <!-- Navbar -->
    <nav th:replace="~{fragments/navbar :: navbar('mensajes')}"></nav>

    <div class="container py-4">
        <h1 class="mb-4">
            <i class="bi bi-chat-dots-fill text-primary me-2"></i>
            Mensajes
        </h1>

        <div class="row">
            <div class="col-md-4">
                <div class="card chat-container">
                    <div class="chat-sidebar">
                        <div class="p-3 border-bottom">
                            <h6 class="mb-0">Conversaciones</h6>
                        </div>
                        <div class="chat-list">
                            <a th:each="ct : ${contactos}" th:href="@{/mensajes(c=${ct.id})}"
                                class="chat-item text-decoration-none text-dark d-block"
                                th:classappend="${ct.id == otroUsuarioId} ? ' active' : ''">
                                <div class="d-flex align-items-center">
                                    <img th:src="${ct.avatarUrl}" class="rounded-circle me-3" width="40" height="40"
                                        th:alt="|Avatar de ${ct.nombre}|">
                                    <div class="flex-grow-1">
                                        <div class="fw-bold" th:text="${ct.nombre}">Nombre</div>
                                        <small class="text-muted" th:text="${ct.profesion}">Profesión</small>
                                    </div>
                                    <small class="text-muted" th:text="${ct.ultimoTiempoRelativo}">2h</small>
                                </div>
                                <div class="mt-1">
                                    <small class="text-muted" th:text="${ct.ultimaVistaPrevia}">Último mensaje</small>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card chat-container">
                    <div class="chat-messages">
                        <!-- Header del chat -->
                        <div class="p-3 border-bottom bg-white">
                            <div class="d-flex align-items-center">
                                <img th:src="${contactoActual.avatarUrl}" class="rounded-circle me-3" width="40" height="40"
                                    th:alt="|Avatar de ${contactoActual.nombre}|">
                                <div>
                                    <h6 class="mb-0" th:text="${contactoActual.nombre}">Nombre</h6>
                                    <small class="text-muted"
                                        th:text="|${contactoActual.profesion} • En línea|">Profesión</small>
                                </div>
                            </div>
                        </div>

                        <div class="messages-list" id="messages-list"
                             th:data-conv-id="${otroUsuarioId}"
                             th:data-last-id="${lastId}"
                             th:data-mi-id="${miId}">
                            <div th:each="mensaje : ${mensajes}" class="message"
                                th:classappend="${mensaje.senderUserId == miId} ? ' sent' : ' received'">
                                <div class="message-bubble" th:text="${mensaje.texto}">Texto</div>
                                <small class="text-muted" th:text="${mensaje.horaCorta}">10:30</small>
                            </div>
                        </div>

                        <form id="form-mensaje" th:action="@{/mensajes/enviar}" method="post" class="message-input">
                            <input type="hidden" name="otroUsuarioId" th:value="${otroUsuarioId}">
                            <div class="input-group">
                                <input type="text" id="input-texto" name="texto" class="form-control"
                                    placeholder="Escribe un mensaje..."
                                    maxlength="2000" autocomplete="off" required aria-label="Mensaje">
                                <button type="submit" class="btn btn-primary" title="Enviar">
                                    <i class="bi bi-send"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light text-center py-4 mt-5 border-top">
        <div class="container">
            <p class="text-muted">© 2026 ServiGo. Todos los derechos reservados.</p>
        </div>
    </footer>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script>
    (function () {
        const list = document.getElementById('messages-list');
        if (!list) return;

        const convId   = list.dataset.convId;
        const miId     = parseInt(list.dataset.miId, 10);
        let   lastId   = parseInt(list.dataset.lastId, 10) || 0;

        function scrollBottom() {
            list.scrollTop = list.scrollHeight;
        }
        scrollBottom();

        function appendMsg(m) {
            const div = document.createElement('div');
            div.className = 'message ' + (m.mio ? 'sent' : 'received');
            div.innerHTML =
                '<div class="message-bubble"></div>' +
                '<small class="text-muted"></small>';
            div.querySelector('.message-bubble').textContent = m.texto;
            div.querySelector('small').textContent = m.hora;
            list.appendChild(div);
            lastId = m.id;
            list.dataset.lastId = lastId;
            scrollBottom();
        }

        // Envío por AJAX para no recargar la página
        const form = document.getElementById('form-mensaje');
        const input = document.getElementById('input-texto');
        if (form) {
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                const texto = input.value.trim();
                if (!texto) return;
                const body = new URLSearchParams(new FormData(form));
                fetch(form.action, { method: 'POST', body })
                    .then(() => {
                        input.value = '';
                        poll();
                    });
            });
        }

        // Polling cada 2.5 segundos
        function poll() {
            if (!convId) return;
            fetch('/mensajes/nuevos?c=' + convId + '&desde=' + lastId)
                .then(r => r.ok ? r.json() : [])
                .then(msgs => msgs.forEach(appendMsg))
                .catch(() => {});
        }

        setInterval(poll, 2500);
    })();
    </script>
</body>

</html>
