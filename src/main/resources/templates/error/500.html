<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del servidor - ServiGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; }
        .error-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-num { font-size: 8rem; font-weight: 900; color: #dc2626; line-height: 1; }
        .error-icon { font-size: 3.5rem; color: #dc2626; }
    </style>
</head>
<body>
    <div class="error-wrap">
        <div class="text-center px-3">
            <div class="error-num">500</div>
            <i class="bi bi-exclamation-triangle error-icon mb-3 d-block"></i>
            <h2 class="fw-bold mb-2">Error interno del servidor</h2>
            <p class="text-muted mb-4">Ocurrió un problema inesperado. Nuestro equipo ya fue notificado.</p>
            <div class="d-flex gap-3 justify-content-center flex-wrap">
                <a href="/" class="btn btn-primary px-4">
                    <i class="bi bi-house-fill me-2"></i>Volver al inicio
                </a>
                <a href="/contactanos" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-envelope me-2"></i>Reportar problema
                </a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
