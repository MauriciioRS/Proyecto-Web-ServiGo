<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Cambiar Contraseña - ServiGo', '/CSS/CambiarContraseña.css')}"></head>

<body>
    <main class="contenedor">
        <div class="tarjeta-formulario">
            <h2 class="text-center mb-3">Cambiar Contraseña</h2>
            <p class="subtitulo text-center text-muted mb-4">Ingresa tu nueva contraseña</p>

            <div th:if="${error}" class="alert alert-danger mb-3" role="alert" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success mb-3" role="alert" th:text="${success}"></div>

            <form class="formulario-password" th:action="@{/cambiar-contrasena}" method="post">
                <div class="grupo-formulario">
                    <label for="current-password">Contraseña Actual</label>
                    <input type="password" id="current-password" name="current-password" placeholder="Ingresa tu contraseña actual" required>
                </div>

                <div class="grupo-formulario">
                    <label for="new-password">Nueva Contraseña</label>
                    <input type="password" id="new-password" name="new-password" placeholder="Ingresa tu nueva contraseña" required>
                    <div id="password-strength" class="password-strength"></div>
                </div>

                <div class="grupo-formulario">
                    <label for="confirm-password">Confirmar Nueva Contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirma tu nueva contraseña" required>
                </div>

                <button type="submit" class="btn-cambiar">Cambiar Contraseña</button>

                <p class="volver">
                    <a th:href="@{/iniciar-sesion}">← Volver al inicio de sesión</a>
                </p>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script>
        // Validación de fortaleza de contraseña
        document.getElementById('new-password').addEventListener('input', function() {
            const password = this.value;
            const strengthIndicator = document.getElementById('password-strength');

            if (password.length === 0) {
                strengthIndicator.textContent = '';
                return;
            }

            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            if (strength <= 2) {
                strengthIndicator.textContent = 'Débil';
                strengthIndicator.className = 'password-strength strength-weak';
            } else if (strength <= 3) {
                strengthIndicator.textContent = 'Media';
                strengthIndicator.className = 'password-strength strength-medium';
            } else {
                strengthIndicator.textContent = 'Fuerte';
                strengthIndicator.className = 'password-strength strength-strong';
            }
        });
    </script>
</body>

</html>
