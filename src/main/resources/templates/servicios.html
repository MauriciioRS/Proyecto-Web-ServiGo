<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Servicios - ServiGo', '/CSS/Servicios.css')}"></head>

<body>
    <!-- Navbar -->
    <nav th:replace="~{fragments/navbar :: navbar('servicios')}"></nav>

    <div class="container py-5">
        <h1 class="mb-4">Todos los Servicios</h1>

        <!-- Filtros -->
        <div class="filtro-section">
            <h5>Filtrar servicios</h5>
            <form action="/servicios" method="get">
                <div class="row gy-3">
                    <div class="col-md-4">
                        <input type="search" class="form-control" name="q" th:value="${query}" placeholder="Buscar servicio..." />
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" name="categoria">
                            <option value="" th:selected="${categoriaSeleccionada == null or categoriaSeleccionada == ''}">Todas las categorías</option>
                            <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}" th:selected="${cat == categoriaSeleccionada}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" name="orden">
                            <option value="" th:selected="${ordenSeleccionado == null or ordenSeleccionado == ''}">Ordenar por...</option>
                            <option value="precio-menor" th:selected="${ordenSeleccionado == 'precio-menor'}">Precio menor</option>
                            <option value="precio-mayor" th:selected="${ordenSeleccionado == 'precio-mayor'}">Precio mayor</option>
                            <option value="mejor-calificacion" th:selected="${ordenSeleccionado == 'mejor-calificacion'}">Mejor calificación</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="submit" class="btn btn-primary">Buscar</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Lista de Servicios -->
        <div class="row">
            <div class="col-md-6 col-lg-4 mb-4" th:each="servicio : ${servicios}">
                <div class="card servicio-card h-100 shadow-sm">
                    <img th:src="${servicio.imagen.startsWith('http') ? servicio.imagen : '/img/' + servicio.imagen}" class="card-img-top" th:alt="|${servicio.nombre} - imagen|" onerror="this.onerror=null;this.src='https://via.placeholder.com/400x300?text=Sin+imagen';" />
                    <div class="card-body">
                        <span class="badge badge-categoria mb-2" th:text="${servicio.categoria}">Categoría</span>
                        <h5 class="card-title" th:text="${servicio.nombre}">Nombre Servicio</h5>
                        <p class="card-text text-muted" th:text="${servicio.descripcion}">Descripción</p>
                        
                        <div class="mb-3">
                            <small class="text-muted">Calificación:</small>
                            <div>
                                <span class="text-warning" th:text="${servicio.calificacion} + '★'">Rating</span>
                                <span class="badge bg-success" th:if="${servicio.disponible}">Disponible</span>
                                <span class="badge bg-danger" th:unless="${servicio.disponible}">No disponible</span>
                            </div>
                        </div>
                        
                        <h4 class="text-primary" th:text="'S/.' + ${servicio.precio}">Precio</h4>
                    </div>
                    <div class="card-footer bg-white border-top">
                        <a th:href="'/servicios/' + ${servicio.id}" class="btn btn-primary w-100 btn-sm">Ver Detalles</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light text-center py-4 mt-5 border-top">
        <div class="container">
            <p class="text-muted">© 2026 ServiGo. Todos los derechos reservados.</p>
        </div>
    </footer>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
