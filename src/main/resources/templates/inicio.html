<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Inicio - ServiGo', '/CSS/Inicio.css')}"></head>

<body>
    <!-- Navbar -->
    <nav th:replace="~{fragments/navbar :: navbar('inicio')}"></nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1 class="hero-title">Encuentra el profesional que necesitas</h1>
            <p class="hero-subtitle">Plomeros, electricistas, pintores y más — cerca de ti</p>

        </div>
    </section>

    <br>

    <!-- Servicios destacados -->
    <section>
        <div class="container">
            <h2 class="text-center mb-4">Tendencias</h2>
            <div class="row">
                <div class="col-md-6 col-lg-4 mb-4" th:each="servicio : ${tendencias}">
                    <div class="card servicio-card h-100">
                        <img th:src="${servicio.imagen.startsWith('http') ? servicio.imagen : '/img/' + servicio.imagen}" class="card-img-top servicio-card-img" th:alt="|${servicio.nombre} - imagen|" onerror="this.onerror=null;this.src='https://via.placeholder.com/400x300?text=Sin+imagen';" />
                        <div class="card-body">
                            <h5 class="card-title" th:text="${servicio.nombre}">Servicio</h5>
                            <p class="card-text" th:text="${servicio.descripcion}">Descripción</p>
                            <p class="text-muted">
                                <strong>Categoría:</strong> <span th:text="${servicio.categoria}">Cat</span>
                            </p>
                            <div class="d-flex justify-content-between align-items-center">
                                <strong class="text-success" th:text="'S/.' + ${servicio.precio}">Precio</strong>
                                <span class="badge bg-warning" th:text="${servicio.calificacion} + '★'">Rating</span>
                            </div>
                        </div>
                        <div class="card-footer bg-white">
                            <a th:href="'/servicios/' + ${servicio.id}" class="btn btn-sm btn-primary w-100">Ver Detalles</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <br>

    <!-- Footer -->
    <footer class="bg-light text-center py-4 mt-5 border-top">
        <div class="container">
            <p class="text-muted">© 2026 ServiGo. Todos los derechos reservados.</p>
        </div>
    </footer>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
