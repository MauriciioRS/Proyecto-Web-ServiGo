<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Mi Perfil - ServiGo', '/CSS/Inicio.css')}"></head>

<body>
    <!-- Navbar -->
    <nav th:replace="~{fragments/navbar :: navbar('perfil')}"></nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Mi Perfil</h3>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-4 text-center">
                                <div class="border rounded p-3">
                                    <i class="bi bi-person-circle display-1 text-primary"></i>
                                    <h5 class="mt-3" th:text="${usuario.nombre}">Nombre</h5>
                                    <p class="text-muted" th:text="${usuario.rol}">Rol</p>
                                </div>
                            </div>
                            <div class="col-md-8">
                                <dl class="row mb-0">
                                    <dt class="col-sm-4">Correo</dt>
                                    <dd class="col-sm-8" th:text="${usuario.email}">correo@example.com</dd>

                                    <dt class="col-sm-4">Teléfono</dt>
                                    <dd class="col-sm-8" th:text="${#strings.isEmpty(usuario.telefono)} ? 'No registrado' : ${usuario.telefono}">555-0000</dd>

                                    <dt class="col-sm-4">DNI</dt>
                                    <dd class="col-sm-8" th:text="${#strings.isEmpty(usuario.dni)} ? '—' : ${usuario.dni}">—</dd>

                                    <dt class="col-sm-4">Fecha de nacimiento</dt>
                                    <dd class="col-sm-8" th:text="${#strings.isEmpty(usuario.fechaNacimiento)} ? '—' : ${usuario.fechaNacimiento}">—</dd>

                                    <dt class="col-sm-4">Dirección</dt>
                                    <dd class="col-sm-8" th:text="${#strings.isEmpty(usuario.direccion)} ? '—' : ${usuario.direccion}">—</dd>

                                    <dt class="col-sm-4">Distrito</dt>
                                    <dd class="col-sm-8" th:text="${#strings.isEmpty(usuario.distrito)} ? '—' : ${usuario.distrito}">—</dd>

                                    <dt class="col-sm-4">Tipo de cuenta</dt>
                                    <dd class="col-sm-8" th:switch="${usuario.rol}">
                                        <span th:case="'cliente'">Cliente</span>
                                        <span th:case="'proveedor'">Contratista</span>
                                        <span th:case="*" th:text="${usuario.rol}">—</span>
                                    </dd>

                                    <dt class="col-sm-4">Estado</dt>
                                    <dd class="col-sm-8" th:text="${usuario.activo ? 'Activo' : 'Inactivo'}">Activo</dd>
                                </dl>
                            </div>
                        </div>
                        <div class="text-end">
                            <a th:href="@{/cambiar-contrasena}" class="btn btn-outline-secondary">Cambiar Contraseña</a>
                            <a th:href="@{/logout}" class="btn btn-danger">Cerrar Sesión</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
