<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Mis Servicios - ServiGo', '/CSS/Servicios.css')}"></head>

<body>
    <style>
        .servicio-mio-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            transition: box-shadow .2s, transform .15s;
            background: #fff;
        }
        .servicio-mio-card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,.1);
            transform: translateY(-3px);
        }
        .servicio-mio-card .card-img-top {
            height: 180px;
            object-fit: cover;
        }
        .servicio-mio-card .card-body {
            padding: 1.25rem;
        }
        .badge-disponible {
            background: #dcfce7;
            color: #16a34a;
        }
        .badge-no-disponible {
            background: #fee2e2;
            color: #dc2626;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }
        .empty-state i {
            font-size: 4rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
            display: block;
        }
    </style>

    <nav th:replace="~{fragments/navbar :: navbar('mis-servicios')}"></nav>

    <div class="container py-4">

        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1"><i class="bi bi-tools me-2 text-primary"></i>Mis Servicios</h3>
                <p class="text-muted mb-0" th:text="'Tienes ' + ${#lists.size(misServicios)} + ' servicio(s) registrado(s)'">Servicios</p>
            </div>
            <a th:href="@{/tecnico/servicios/crear}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-1"></i>Nuevo Servicio
            </a>
        </div>

        <!-- Alertas -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Sin servicios -->
        <div th:if="${#lists.isEmpty(misServicios)}" class="empty-state">
            <i class="bi bi-tools"></i>
            <h4 class="text-muted fw-normal">Aún no tienes servicios</h4>
            <p class="text-muted mb-4">Crea tu primer servicio para que los clientes puedan encontrarte.</p>
            <a th:href="@{/tecnico/servicios/crear}" class="btn btn-primary px-4">
                <i class="bi bi-plus-circle me-2"></i>Crear mi primer servicio
            </a>
        </div>

        <!-- Lista de servicios -->
        <div class="row g-4" th:if="${not #lists.isEmpty(misServicios)}">
            <div class="col-md-6 col-lg-4" th:each="servicio : ${misServicios}">
                <div class="servicio-mio-card h-100 d-flex flex-column">
                    <img th:src="${servicio.imagen.startsWith('http') ? servicio.imagen : '/img/' + servicio.imagen}"
                         class="card-img-top"
                         th:alt="${servicio.nombre}"
                         onerror="this.onerror=null;this.src='https://via.placeholder.com/400x200?text=Sin+imagen';" />
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="fw-bold mb-0" th:text="${servicio.nombre}">Servicio</h5>
                            <span class="badge" th:classappend="${servicio.disponible} ? 'badge-disponible' : 'badge-no-disponible'"
                                  th:text="${servicio.disponible} ? 'Activo' : 'Inactivo'"></span>
                        </div>
                        <p class="text-muted small mb-2" th:text="${servicio.descripcion}">Descripción</p>
                        <div class="mb-2">
                            <span class="badge bg-light text-dark border">
                                <i class="bi bi-tag me-1"></i><span th:text="${servicio.categoria}">Categoría</span>
                            </span>
                            <span class="badge bg-light text-dark border" th:if="${servicio.calificacion > 0}">
                                <i class="bi bi-star-fill text-warning me-1"></i><span th:text="${servicio.calificacion}">4</span>★
                            </span>
                        </div>
                        <div class="mt-auto d-flex justify-content-between align-items-center">
                            <strong class="text-success fs-5" th:text="'S/.' + ${servicio.precio}">S/.50</strong>
                            <div class="d-flex gap-2">
                                <a th:href="@{'/tecnico/servicios/' + ${servicio.id} + '/editar'}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-pencil"></i> Editar
                                </a>
                                <form th:action="@{'/tecnico/servicios/' + ${servicio.id} + '/eliminar'}"
                                      method="post"
                                      onsubmit="return confirm('¿Eliminar este servicio permanentemente?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <footer class="bg-light text-center py-4 mt-5 border-top">
        <div class="container">
            <p class="text-muted mb-0">© 2026 ServiGo. Todos los derechos reservados.</p>
        </div>
    </footer>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
