<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Registro - ServiGo', '/CSS/Registro.css')}"></head>

<body>
    <main class="contenedor">
        <section class="panel-derecho">
            <img src="https://images.unsplash.com/photo-1515378791036-0648a3ef77b2?auto=format&fit=crop&w=900&q=80" alt="Usuario creando cuenta en ServiGo">
        </section>

        <section class="panel-izquierdo">
            <div class="tarjeta-formulario">
                <h2 class="text-center mb-3">Crear Cuenta</h2>
                <p class="subtitulo text-center text-muted mb-4">Regístrate para acceder a nuestros servicios</p>

                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                <form th:action="@{/registro}" method="post" class="formulario-registro">
                    <div class="grupo-formulario">
                        <label for="nombres">Nombres</label>
                        <input type="text" id="nombres" name="nombres" placeholder="Ingresa tus nombres" required>
                    </div>

                    <div class="grupo-formulario">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" placeholder="Ingresa tus apellidos" required>
                    </div>

                    <div class="grupo-formulario">
                        <label for="dni">DNI</label>
                        <input type="text" id="dni" name="dni" placeholder="Ingresa tu DNI" required>
                    </div>

                    <div class="grupo-formulario">
                        <label for="fecha-nacimiento">Fecha de Nacimiento</label>
                        <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required>
                    </div>

                    <div class="grupo-formulario">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" name="direccion" placeholder="Ingresa tu dirección" required>
                    </div>

                    <div class="grupo-formulario">
                        <label for="distrito">Distrito</label>
                        <input type="text" id="distrito" name="distrito" placeholder="Ingresa tu distrito" required>
                    </div>

                    <div class="grupo-formulario">
                        <label for="tipo-cuenta">Tipo de Cuenta</label>
                        <select id="tipo-cuenta" name="tipo-cuenta" required>
                            <option value="">Selecciona un tipo</option>
                            <option value="cliente">Cliente</option>
                            <option value="contratista">Contratista</option>
                        </select>
                    </div>

                    <div class="grupo-formulario">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="Ingresa tu correo" required>
                    </div>

                    <div class="grupo-formulario">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="Ej. 987 654 321" required>
                    </div>

                    <div class="grupo-formulario">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
                    </div>

                    <button type="submit" class="btn-registro">Crear Cuenta</button>

                    <p class="registro">¿Ya tienes una cuenta? <a th:href="@{/iniciar-sesion}">Inicia Sesión</a></p>
                </form>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
