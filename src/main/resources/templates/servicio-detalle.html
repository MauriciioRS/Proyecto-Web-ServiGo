<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Servicio - ServiGo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
        rel="stylesheet">
    <link href="/CSS/navbar.css" rel="stylesheet">
    <style>html { overflow-y: scroll; }</style>
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-tools"></i> ServiGo
            </a>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="card shadow border-0">

            <div class="card-body p-5">

                
                <h1 class="mb-3 fw-bold"
                    th:text="${servicio.nombre}">
                    Nombre del Servicio
                </h1>
                <p class="text-muted fs-5"
                   th:text="${servicio.descripcion}">
                    Descripción del servicio
                </p>

                <hr class="my-4">

                <p class="fs-5">
                    <i class="bi bi-tags-fill"></i>
                    <strong>Categoría:</strong>
                    <span th:text="${servicio.categoria}">
                        Categoría
                    </span>
                </p>

                <p class="fs-5">
                    <i class="bi bi-cash-stack"></i>
                    <strong>Precio:</strong>
                    <span class="text-success fw-bold"
                          th:text="'$' + ${servicio.precio}">
                        $0
                    </span>
                </p>

                <p class="fs-5">
                    <i class="bi bi-star-fill text-warning"></i>
                    <strong>Calificación:</strong>

                    <span class="badge bg-warning text-dark"
                          th:text="${servicio.calificacion} + '★'">
                        5★
                    </span>
                </p>


                <div class="mt-4 d-flex gap-2">

                    <a href="/"
                       class="btn btn-primary">
                        <i class="bi bi-arrow-left"></i>
                        Volver al inicio
                    </a>

                    <button class="btn btn-outline-success">
                        <i class="bi bi-chat-dots-fill"></i>
                        Contactar
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
