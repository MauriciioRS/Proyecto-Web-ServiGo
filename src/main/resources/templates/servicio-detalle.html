<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Detalle - ServiGo', null)}"></head>

<body class="bg-light">
    <style>html { overflow-y: scroll; }</style>

    <!-- Navbar -->
    <nav th:replace="~{fragments/navbar :: navbar('servicios')}"></nav>

    <div class="container mt-5">

        <div class="card shadow border-0">

            <div class="card-body p-5">

                
                <h1 class="mb-3 fw-bold"
                    th:text="${servicio.nombre}">
                    Nombre del Servicio
                </h1>
                <p class="text-muted fs-5"
                   th:text="${servicio.descripcion}">
                    Descripción del servicio
                </p>

                <hr class="my-4">

                <p class="fs-5">
                    <i class="bi bi-tags-fill"></i>
                    <strong>Categoría:</strong>
                    <span th:text="${servicio.categoria}">
                        Categoría
                    </span>
                </p>

                <p class="fs-5">
                    <i class="bi bi-cash-stack"></i>
                    <strong>Precio:</strong>
                    <span class="text-success fw-bold"
                          th:text="'S/.' + ${servicio.precio}">
                        S/.0
                    </span>
                </p>

                <p class="fs-5">
                    <i class="bi bi-star-fill text-warning"></i>
                    <strong>Calificación:</strong>

                    <span class="badge bg-warning text-dark"
                          th:text="${servicio.calificacion} + '★'">
                        5★
                    </span>
                </p>


                <div class="mt-4 d-flex gap-2 flex-wrap">

                    <a th:href="@{/servicios}" href="/servicios" class="btn btn-primary">
                        <i class="bi bi-arrow-left"></i> Volver a servicios
                    </a>

                    <!-- Contactar al proveedor -->
                    <a th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol == 'cliente' and not esProveedorDelServicio}"
                       th:href="@{/mensajes(c=${servicio.proveedorId})}"
                       class="btn btn-info text-white">
                        <i class="bi bi-chat-dots-fill"></i> Contactar al proveedor
                    </a>

                    <!-- Ya tiene solicitud activa -->
                    <span th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol == 'cliente' and yaContratado}"
                          class="btn btn-secondary disabled">
                        <i class="bi bi-check-circle-fill me-1"></i>Ya contratado
                    </span>

                    <!-- Usuario logueado: solicitar servicio (no es su propio servicio) -->
                    <form th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol == 'cliente' and not esProveedorDelServicio and not yaContratado}"
                          th:action="@{/solicitudes/crear}" method="post" class="d-inline">
                        <input type="hidden" name="servicioId" th:value="${servicio.id}">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-send-fill"></i> Solicitar Servicio
                        </button>
                    </form>

                    <!-- Toggle favorito (solo logueado) -->
                    <form th:if="${session.usuarioLogueado != null}"
                          th:action="@{/favoritos/toggle}" method="post" class="d-inline">
                        <input type="hidden" name="servicioId" th:value="${servicio.id}">
                        <input type="hidden" name="returnUrl" th:value="'/servicios/' + ${servicio.id}">
                        <button type="submit"
                                th:class="${esFavorito} ? 'btn btn-danger' : 'btn btn-outline-danger'">
                            <i th:class="${esFavorito} ? 'bi bi-suit-heart-fill' : 'bi bi-suit-heart'"></i>
                            <span th:text="${esFavorito} ? 'En favoritos' : 'Guardar en favoritos'">Favorito</span>
                        </button>
                    </form>

                    <!-- No logueado: ir a login -->
                    <a th:unless="${session.usuarioLogueado != null}"
                       th:href="@{/iniciar-sesion}" href="/iniciar-sesion"
                       class="btn btn-outline-success">
                        <i class="bi bi-box-arrow-in-right"></i> Inicia sesión para solicitar
                    </a>

                </div>

            </div>

        </div>

    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
