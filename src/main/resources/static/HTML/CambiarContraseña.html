<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - ServiGo</title>
    <link rel="stylesheet" href="../CSS/CambiarContraseña.css">
</head>

<body>
    <main class="contenedor">

        <section class="panel-derecho">
            <img src="../../Images/Index.png" alt="Imagen de servicio">
        </section>

        <section class="panel-izquierdo">
            <div class="tarjeta-formulario">

                <h2>¿Haz olvidado tu contraseña?</h2>

                <form>
                    <div class="grupo-formulario">
                        <label for="email">Correo electrónico o Telefono</label>
                        <input type="email" id="email" name="email"
                            placeholder="Ingresa tu correo electrónico o Telefono">
                    </div>

                    <button type="button" class="btn btn-primary">Enviar</button>
                    <button type="button" onclick="location.href='IniciarSesion.html'" class="btn btn-secondary">Cancelar</button>
            </div>

            </form>
            </div>
        </section>

    </main>
</body>

</html>
