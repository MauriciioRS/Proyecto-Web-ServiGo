<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos - ServiGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/Inicio.css">
    <link rel="stylesheet" href="../CSS/Contactanos.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="Inicio.html">ServiGo</a>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="Inicio.html"><i class="bi bi-house-door-fill"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-envelope-fill"></i> Contáctanos</a></li>
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"><i class="bi bi-person-circle"></i> Yo</a>
                        <ul class="dropdown-menu">
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-5">
            <div class="col-lg-5">
                <h2 class="fw-bold mb-4">Estamos para ayudarte</h2>
                <p class="text-muted mb-5">¿Tienes dudas sobre cómo funciona ServiGo o eres un profesional que quiere unirse? Escríbenos.</p>
                
                <div class="d-flex align-items-center mb-4 contact-item">
                    <div class="icon-box bg-primary text-white me-3">
                        <i class="bi bi-geo-alt"></i>
                    </div>
                    <div>
                        <h6 class="mb-0 fw-bold">Ubicación</h6>
                        <p class="mb-0 text-muted">Lima, Perú</p>
                    </div>
                </div>

                <div class="d-flex align-items-center mb-4 contact-item">
                    <div class="icon-box bg-primary text-white me-3">
                        <i class="bi bi-telephone"></i>
                    </div>
                    <div>
                        <h6 class="mb-0 fw-bold">Teléfono</h6>
                        <p class="mb-0 text-muted">+51 999 888 777</p>
                    </div>
                </div>

                <div class="d-flex align-items-center mb-4 contact-item">
                    <div class="icon-box bg-primary text-white me-3">
                        <i class="bi bi-envelope"></i>
                    </div>
                    <div>
                        <h6 class="mb-0 fw-bold">Email</h6>
                        <p class="mb-0 text-muted">soporte@servigo.com</p>
                    </div>
                </div>

                <div class="mt-5">
                    <h6 class="fw-bold mb-3">Síguenos</h6>
                    <div class="d-flex gap-3">
                        <a href="#" class="social-link"><i class="bi bi-facebook"></i></a>
                        <a href="#" class="social-link"><i class="bi bi-instagram"></i></a>
                        <a href="#" class="social-link"><i class="bi bi-linkedin"></i></a>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card border-0 shadow p-4 p-md-5">
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Nombre</label>
                                <input type="text" class="form-control" placeholder="Tu nombre">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Correo Electrónico</label>
                                <input type="email" class="form-control" placeholder="correo@ejemplo.com">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold small">Asunto</label>
                                <select class="form-select">
                                    <option>Soporte técnico</option>
                                    <option>Consulta de pagos</option>
                                    <option>Soy profesional y quiero unirme</option>
                                    <option>Otro</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold small">Mensaje</label>
                                <textarea class="form-control" rows="5" placeholder="¿En qué podemos ayudarte?"></textarea>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Enviar Mensaje</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
